    // Unlimited-Length Citizen Calculator Live Evaluator (No 14-number limit!)
    function evaluateCitizenLive(raw) {
      const clean = String(raw || '').replace(/\s+/g, '');
      const matches = clean.match(/([+\-×÷*/]?)\s*(\d+(?:\.\d+)?|\.\d+)/g) || [];
      const terms = matches.map((m, i) => {
        const fc = m[0];
        const hasOp = ['+', '-', '×', '÷', '*', '/'].includes(fc);
        return {
          index: i + 1,
          op: hasOp ? fc.replace('*', '×').replace('/', '÷') : (i === 0 ? '' : '+'),
          val: hasOp ? m.slice(1) : m
        };
      });

      if (!clean) return { result: '0', num: 0, count: 0, terms: [] };

      let expr = clean
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-')
        .replace(/(\d+(?:\.\d+)?)%/g, '($1*0.01)');

      while (/[+\-*/.(]$/.test(expr)) {
        expr = expr.slice(0, -1);
      }
      if (!expr) return { result: '0', num: 0, count: terms.length, terms };

      const openC = (expr.match(/\(/g) || []).length;
      const closeC = (expr.match(/\)/g) || []).length;
      if (openC > closeC) expr += ')'.repeat(openC - closeC);

      if (!/^[0-9+\-*/().\s]+$/.test(expr)) {
        return { result: '0', num: 0, count: terms.length, terms };
      }

      try {
        const v = Function('"use strict"; return (' + expr + ');')();
        if (typeof v === 'number' && Number.isFinite(v)) {
          const rounded = Number(Math.round(Number(v + 'e10')) + 'e-10');
          return { result: String(rounded), num: rounded, count: terms.length, terms };
        }
      } catch {}
      return { result: '0', num: 0, count: terms.length, terms };
    }

      calcDigit(d) {
        state.calcGstNote = '';
        state.calcExpr += String(d);

        const box = document.getElementById('calc-expr-box');
        if (box) { box.scrollTop = box.scrollHeight; box.scrollLeft = box.scrollWidth; }
      },
      calcOp(op) {
        state.calcGstNote = '';
        if (!state.calcExpr) {
          if (op === '-') state.calcExpr = '-';
          render();
          return;
        }
        if (/[+\-×÷]$/.test(state.calcExpr)) {
          state.calcExpr = state.calcExpr.slice(0, -1) + op;
        } else {
          state.calcExpr += op;
        }
        render();
      },
      calcDot() {
        state.calcGstNote = '';
        const parts = state.calcExpr.split(/[+\-×÷()]/);
        const cur = parts[parts.length - 1] || '';
        if (cur.includes('.')) return;
        state.calcExpr += cur ? '.' : '0.';
        render();
      },
      calcParen() {
        state.calcGstNote = '';
        const openC = (state.calcExpr.match(/\(/g) || []).length;
        const closeC = (state.calcExpr.match(/\)/g) || []).length;
        const last = state.calcExpr.slice(-1);
        if (openC > closeC && /[0-9)%]/.test(last)) {
          state.calcExpr += ')';
        } else if (/[0-9)]/.test(last)) {
          state.calcExpr += '×(';
        } else {
          state.calcExpr += '(';
        }
        render();
      },
      calcPercent() {
        if (!state.calcExpr || /[+\-×÷(%]$/.test(state.calcExpr)) return;
        state.calcExpr += '%';
        render();
      },
      calcPlusMinus() {
        if (!state.calcExpr) { state.calcExpr = '-'; render(); return; }
        if (state.calcExpr === '-') { state.calcExpr = ''; render(); return; }
        const m = state.calcExpr.match(/(\d+(?:\.\d+)?)$/);
        if (!m) return;
        const num = m[1];
        const pref = state.calcExpr.slice(0, state.calcExpr.length - num.length);
        state.calcExpr = pref.endsWith('(-') ? pref.slice(0, -2) + num : pref + '(-' + num;
        render();
      },
      calcBack() {
        state.calcGstNote = '';
        state.calcExpr = state.calcExpr.slice(0, -1);
        render();
      },
      calcClear() {
        state.calcGstNote = '';
        state.calcExpr = '';
        render();
      },
      calcEquals() {
        if (!state.calcExpr.trim()) return;
        const ev = evaluateCitizenLive(state.calcExpr);
        const cleanExpr = state.calcExpr.replace(/[+\-×÷]+$/, '');
        state.calcHistory.unshift({ expr: cleanExpr, result: ev.result, count: ev.count });
        state.calcExpr = ev.result;

        if (!ev.num) return;
        const gst = Number(((ev.num * rate) / 100).toFixed(2));
        const total = Number((ev.num + gst).toFixed(2));
        state.calcGstNote = `GST ${rate > 0 ? '+' + rate : rate}%: Base=${ev.num} | GST=${gst} | Total=${total}`;
        state.calcExpr = String(total);
        render();
      },

          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 space-y-6">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
              <h1 class="text-lg sm:text-xl font-extrabold text-[#172033]">${state.editingItemId ? 'Edit' : 'Add New'} ${state.editingTargetType === 'game' ? 'Game' : 'App'}</h1>
              <button onclick="window.apkHubActions.setSection('${state.editingTargetType === 'game' ? 'games' : 'apps'}')" class="px-3.5 py-2 rounded-xl bg-[#F4F7FC] text-xs font-bold cursor-pointer">Cancel</button>
            </div>
            <form onsubmit="window.apkHubActions.saveAppForm(event)" class="space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Name *</label><input id="f-name" required value="${f.name || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" /></div>
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Developer *</label><input id="f-dev" required value="${f.developer || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" /></div>
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Package Name *</label><input id="f-pkg" required value="${f.packageName || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs font-mono" /></div>
                <div>
                  <label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Category *</label>
                  <select id="f-cat" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs font-bold">
                    ${state.categories.map((c) => `<option value="${c.name}" ${c.name === f.category ? 'selected' : ''}>${c.name}</option>`).join('')}
                  </select>
                </div>
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Version *</label><input id="f-ver" required value="${f.version || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs font-mono" /></div>
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">File Size *</label><input id="f-size" required value="${f.size || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" /></div>
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Min Android *</label><input id="f-sdk" required value="${f.minAndroid || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" /></div>
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Release Date *</label><input id="f-date" type="date" required value="${f.releaseDate || '2026-11-11'}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" /></div>
                <div>
                  <label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Status</label>
                  <select id="f-status" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs font-bold">
                    <option value="active" ${f.status === 'active' ? 'selected' : ''}>Active (Published)</option>
                    <option value="inactive" ${f.status === 'inactive' ? 'selected' : ''}>Inactive (Hidden)</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">App Icon Badge / URL</label><input id="f-icon" value="${f.iconUrl || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" /></div>
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">APK File Name</label><input id="f-apkfile" value="${f.apkFileName || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs font-mono" /></div>
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Direct APK Download URL</label><input id="f-dlurl" value="${f.apkDownloadUrl || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" /></div>
                <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">External Mirror URL</label><input id="f-exturl" value="${f.externalDownloadUrl || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" /></div>
              </div>
              <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Short Description *</label><input id="f-short" required value="${f.shortDescription || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" /></div>
              <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Full Description *</label><textarea id="f-full" rows="3" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs">${f.fullDescription || ''}</textarea></div>
              <div><label class="block text-xs font-bold uppercase text-[#64748B] mb-1">What's New</label><textarea id="f-whatsnew" rows="2" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs">${f.whatsNew || ''}</textarea></div>
              <div class="flex flex-wrap gap-6 pt-2 text-xs font-bold">
                <label class="inline-flex items-center gap-2"><input id="f-dlenabled" type="checkbox" ${f.downloadEnabled ? 'checked' : ''} /> Enable Download Button</label>
                <label class="inline-flex items-center gap-2"><input id="f-featured" type="checkbox" ${f.featured ? 'checked' : ''} /> Featured Badge</label>
                <label class="inline-flex items-center gap-2"><input id="f-trending" type="checkbox" ${f.trending ? 'checked' : ''} /> Trending APK</label>
              </div>
              <div class="pt-4 border-t border-slate-100 flex justify-end">
                <button type="submit" class="px-6 py-3 rounded-xl bg-[#16C653] text-white font-extrabold text-xs shadow-lg cursor-pointer">Publish to Firebase</button>
              </div>
            </form>
          </div>
        `;
      } else {
        mainHtml = `
          <div class="bg-white rounded-3xl p-6 border border-slate-200/80 space-y-4">
            <h1 class="text-lg font-extrabold text-[#172033] capitalize">${state.activeSection}</h1>
            <p class="text-xs text-[#64748B]">Connected to Firestore database ai-studio-apkhubfastsecure-598670a6-205f-4cfa-9c47-0a8e888e271f.</p>
            <button onclick="window.apkHubActions.setSection('dashboard')" class="px-4 py-2 rounded-xl bg-[#16C653] text-white font-bold text-xs cursor-pointer">Back to Overview</button>
          </div>
        `;
      }

      root.innerHTML = `
        <div class="min-h-screen bg-[#F4F7FC] text-[#172033] flex flex-col lg:flex-row">
          ${state.toast ? `
            <div class="fixed top-4 right-4 z-50 p-4 rounded-2xl shadow-xl border bg-white ${state.toast.isError ? 'border-red-300 text-red-900' : 'border-emerald-300 text-[#172033]'} text-xs max-w-sm">
              <div class="font-extrabold">${state.toast.title}</div>
              <div class="text-[#64748B] mt-0.5">${state.toast.message}</div>
            </div>
          ` : ''}
          <aside class="w-full lg:w-72 bg-[#101A3A] text-white flex flex-col justify-between shrink-0 p-5 space-y-6">
            <div class="space-y-6">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-[#16C653] text-[#101A3A] font-black text-sm flex items-center justify-center">APK</div>
                  <div>
                    <div class="text-base font-extrabold">APK <span class="text-[#16C653]">Hub</span> <span class="text-[10px] px-1.5 py-0.5 rounded bg-[#7047EB] uppercase">Admin</span></div>
                    <div class="text-[11px] text-slate-400">Firebase Realtime Console</div>
                  </div>
                </div>
              </div>
              <nav class="flex lg:flex-col gap-1 overflow-x-auto pb-2 lg:pb-0">
                ${navItems.map(([id, label, badge]) => `
                  <button onclick="window.apkHubActions.setSection('${id}')" class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap cursor-pointer ${state.activeSection === id ? 'bg-[#16C653] text-[#101A3A]' : 'text-slate-300 hover:bg-[#172554]'}">
                    <span>${label}</span>
                    ${badge !== '' ? `<span class="ml-2 px-1.5 py-0.5 rounded bg-black/20 text-[10px]">${badge}</span>` : ''}
                  </button>
                `).join('')}
              </nav>
            </div>
            <div class="pt-4 border-t border-white/10 flex items-center justify-between gap-2">
              <span class="text-xs text-slate-300 truncate">${state.currentUser.email}</span>
              <button onclick="window.apkHubActions.logout()" class="px-3 py-1.5 rounded-xl bg-red-500/20 text-red-300 text-xs font-bold cursor-pointer">Logout</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-white border-b border-slate-200/80 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
              <div>
                <div class="text-sm sm:text-lg font-extrabold text-[#172033] capitalize">${state.activeSection.replace('-', ' ')}</div>
                <div class="text-[11px] text-[#64748B]">Connected to Firebase: <strong class="font-mono text-[#172033]">bionic-bebop-t8gvj</strong></div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="window.apkHubActions.switchMode('public')" class="px-3 py-2 rounded-xl bg-[#101A3A] hover:bg-[#172554] text-white text-xs font-bold cursor-pointer">← Public Website</button>
                <button onclick="window.apkHubActions.syncSeed()" class="px-3 py-2 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs font-bold cursor-pointer">Sync DB</button>
                <button onclick="window.apkHubActions.openAdd('app')" class="px-3.5 py-2 rounded-xl bg-[#16C653] text-white font-extrabold text-xs cursor-pointer">+ New APK</button>
              </div>
            </header>
            <main class="p-4 sm:p-8 max-w-7xl w-full mx-auto flex-1">${mainHtml}</main>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app-root');
      if (!root) return;
      if (state.mode === 'admin') {
        renderAdminPanel(root);
      } else {
        renderPublicWebsite(root);
      }
    }

    render();
  </script>
</body>
</html>
