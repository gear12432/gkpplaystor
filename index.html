    async function triggerApkDownload(slug) {
      const app = APK_ITEMS.find((a) => a.slug === slug);
      if (!app) return;
      state.downloadStatus = 'downloading';
      state.downloadProgress = 0;
      state.downloadError = null;
      renderApp();

      if (!app.isAuthorizedDirectApk) {
        await new Promise((r) => setTimeout(r, 350));
        state.downloadStatus = 'error';
        state.downloadError = `${app.name} (${app.packageName}) is a proprietary application owned by ${app.developer}. In accordance with copyright compliance, APK Hub does not redistribute unauthorized copyrighted binaries. Please use the official developer website link below or choose a Verified Open-Source APK package.`;
        renderApp();
        return;
      }

      for (let step = 1; step <= 5; step++) {
        await new Promise((r) => setTimeout(r, 110));
        state.downloadProgress = step * 20;
        renderApp();
      }

      const manifestText = [
        'Manifest-Version: 1.0',
        `Package-Name: ${app.packageName}`,
        `Application-Label: ${app.name}`,
        `Version-Name: ${app.version}`,
        `Developer: ${app.developer}`,
        `Min-Android-SDK: ${app.minAndroid}`,
        `License: ${app.license}`,
        `SHA256-Fingerprint: ${app.sha256}`,
        `Official-Upstream-URL: ${app.officialExternalApkUrl || app.officialWebsiteUrl}`,
        ''
      ].join('\r\n');

      const blob = new Blob([manifestText], { type: 'application/vnd.android.package-archive' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${app.packageName}-v${app.version.replace(/\s+/g, '_')}.apk`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 10000);

      state.downloadStatus = 'completed';
      renderApp();
    }

                  ${app.verifiedRating ? `<span class="font-bold text-amber-500">★ ${app.verifiedRating}</span>` : ''}
                  <span>${app.minAndroid}</span>
                  ${app.securityVerified ? `<span class="text-emerald-600 dark:text-[#75E85C] font-semibold">✓ Verified APK</span>` : ''}
                </div>
              </div>
            </div>

            ${state.downloadStatus === 'downloading' || state.downloadStatus === 'completed' ? `
              <div class="space-y-1.5 pt-1">
                <div class="w-full h-2.5 bg-slate-100 dark:bg-[#0B1229] rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-[#16C653] to-[#75E85C] transition-all" style="width: ${state.downloadProgress}%"></div>
                </div>
                <div class="flex items-center justify-between text-xs font-mono text-[#64748B] dark:text-slate-300">
                  <span>${state.downloadStatus === 'completed' ? `✓ Download Complete (${app.packageName}-v${app.version}.apk)` : 'Downloading APK package...'}</span>
                  <span>${state.downloadProgress}%</span>
                </div>
              </div>
            ` : ''}

            ${state.downloadStatus === 'error' && state.downloadError ? `
              <div class="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 text-xs text-amber-950 dark:text-amber-100 leading-relaxed">
                <strong>Official Source Notice:</strong> ${state.downloadError}
              </div>
            ` : ''}

            <!-- 2. Single-Row Horizontal Scroll: App Feature Image + 4 App Screenshot Images (Right-to-Left Scroll) -->
            <div class="space-y-2.5 pt-3 border-t border-slate-100 dark:border-white/10">
              <div class="flex items-center justify-between">
                <h2 class="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-[#64748B] dark:text-slate-300">
                  App Feature &amp; Screenshots
                </h2>
                <span class="text-[11px] font-semibold text-[#16C653] dark:text-[#75E85C]">
                  Swipe ← →
                </span>
              </div>

              <div class="flex items-stretch gap-3 overflow-x-auto snap-x snap-mandatory pb-2 -mx-1 px-1">
                <!-- Item 1: Wide App Feature Graphic Card -->
                <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r ${app.bgGradient} p-4 sm:p-5 text-white shadow-md w-[255px] sm:w-[320px] h-[205px] sm:h-[230px] shrink-0 snap-start flex flex-col justify-between border border-slate-200/40 dark:border-white/15">
                  <div class="absolute inset-0 bg-gradient-to-r from-[#101A3A]/85 via-[#101A3A]/55 to-transparent pointer-events-none"></div>
                  <div class="relative z-10 flex items-center justify-between gap-2">
                    <span class="text-[10px] font-mono uppercase tracking-wider text-[#75E85C] font-bold">
                      Featured · v${app.version}
                    </span>
                    <span class="px-2 py-0.5 rounded-md bg-white/15 text-[10px] font-bold text-white">
                      ${app.size}
                    </span>
                  </div>

                  <div class="relative z-10 space-y-1.5 my-auto py-1">
                    <div class="text-base sm:text-lg font-extrabold text-white leading-snug">
                      ${app.name} — Official Android Package
                    </div>
                    <p class="text-xs text-slate-200 line-clamp-2 leading-relaxed">
                      ${app.shortDescription}
                    </p>
                  </div>

                  <div class="relative z-10 pt-2 border-t border-white/15 flex items-center justify-between text-[10px] text-white/80 font-semibold">
                    <span>✓ Verified Signature</span>
                    <span>Feature Graphic</span>
                  </div>
                </div>

                <!-- Items 2–5: 4 Portrait App Screenshot Cards in the Same Horizontal Line -->
                ${portraitScreens.map((sc, idx) => `
                  <div class="rounded-2xl p-3.5 w-[140px] sm:w-[160px] h-[205px] sm:h-[230px] shrink-0 snap-start border border-slate-200 dark:border-white/15 shadow-sm flex flex-col justify-between text-white" style="background: linear-gradient(160deg, ${sc.bgFrom} 0%, ${sc.bgTo} 100%);">
                    <div class="flex items-center justify-between text-[10px] text-white/70 font-mono pb-1.5 border-b border-white/10">
                      <span>9:41</span>
                      <span class="px-1.5 py-0.5 rounded bg-white/10 text-[9px] text-[#75E85C] truncate max-w-[78px]">${sc.tag}</span>
                    </div>
                    <div class="my-1.5 space-y-1.5 flex-1 flex flex-col justify-center">
                      <div class="w-8 h-8 rounded-xl bg-gradient-to-br ${app.bgGradient} flex items-center justify-center text-white text-[11px] font-extrabold shadow">
                        ${app.labelText}
                      </div>
                      <div class="text-xs font-extrabold text-white leading-snug line-clamp-1">${sc.title}</div>
                      <p class="text-[10px] text-slate-300 leading-snug line-clamp-2">${sc.caption}</p>
                      <div class="space-y-1 pt-0.5">
                        <div class="h-1.5 w-full rounded-full bg-white/15 overflow-hidden">
                          <div class="h-full rounded-full bg-[#16C653]" style="width: ${sc.barWidth}%"></div>
                        </div>
                        <div class="h-1.5 w-2/3 rounded-full bg-white/10"></div>
                      </div>
                    </div>
                    <div class="pt-1.5 border-t border-white/10 flex items-center justify-between text-[9px] text-white/60">
                      <span>Screen 0${idx + 1}</span>
                      <span>HD</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>

          <!-- 3. About This App (Short Description + Long Description + What's New) -->
          <section class="bg-white dark:bg-[#152046] border border-slate-200/80 dark:border-white/10 rounded-3xl p-5 sm:p-8 space-y-5 shadow-xs">
            <div>
              <h2 class="text-lg sm:text-xl font-extrabold text-[#111827] dark:text-white">
                About ${app.name}
              </h2>
              <p class="text-xs text-[#64748B] dark:text-slate-400 mt-0.5">
                Updated ${app.updatedAt} · Developed by ${app.developer}
              </p>
            </div>

            <p class="text-sm sm:text-base font-semibold text-[#111827] dark:text-slate-100 leading-relaxed">
              ${app.shortDescription}
            </p>

            <p class="text-sm sm:text-base text-[#64748B] dark:text-slate-300 leading-relaxed">
              ${app.fullDescription}
            </p>

            <div class="pt-3 border-t border-slate-100 dark:border-white/10 space-y-2.5">
              <h3 class="text-sm sm:text-base font-extrabold text-[#111827] dark:text-white">
                What's New in v${app.version}
              </h3>
              <ul class="space-y-1.5 text-xs sm:text-sm text-[#64748B] dark:text-slate-300">
                ${(app.whatsNew || []).map((w) => `
                  <li class="flex items-start gap-2">
                    <span class="text-[#16C653] font-bold">•</span>
                    <span>${w}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </section>
        </div>
      `;
    }

    function renderDetailsView() {
      return renderUnifiedAppDetailsAndDownloadView();
    }

    function renderDownloadView() {
      return renderUnifiedAppDetailsAndDownloadView();
    }

    function renderDirectoryView(title, filterFn) {
      const items = APK_ITEMS.filter(filterFn);
      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-6">
          <div class="bg-gradient-to-r from-[#101A3A] to-[#6829E8] rounded-3xl p-8 text-white">
            <h1 class="text-2xl sm:text-3xl font-extrabold">${title}</h1>
            <p class="text-sm text-slate-200 mt-1">Showing ${items.length} Android packages</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${items.map(renderLatestCard).join('')}
          </div>
        </div>
      `;
    }

    function renderAboutView() {
      return `
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-6">
          <div class="bg-gradient-to-r from-[#101A3A] to-[#6829E8] rounded-3xl p-8 text-white">
            <h1 class="text-2xl sm:text-3xl font-extrabold">About APK Hub</h1>
            <p class="text-sm text-slate-200 mt-2">Fast, transparent Android APK discovery with SHA-256 verification and zero login requirements.</p>
          </div>
          <div class="bg-white dark:bg-[#152046] rounded-3xl p-6 sm:p-8 space-y-4 text-sm text-[#64748B] dark:text-slate-300 leading-relaxed">
            <p>APK Hub indexes authorized open-source Android applications and official standalone installers with full package metadata, minimum Android version requirements, and cryptographic checksum transparency.</p>
            <p>No user registration, login, or account is ever required to browse or download available packages.</p>
          </div>
        </div>
      `;
    }

    function renderContactView() {
      return `
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-6">
          <div class="bg-gradient-to-r from-[#101A3A] to-[#6829E8] rounded-3xl p-8 text-white">
            <h1 class="text-2xl sm:text-3xl font-extrabold">Contact APK Hub</h1>
            <p class="text-sm text-slate-200 mt-1">Send us a message without creating an account.</p>
          </div>
          <div class="bg-white dark:bg-[#152046] rounded-3xl p-6 sm:p-8">
            ${state.contactSubmittedTicket ? `
              <div class="text-center py-6 space-y-3">
                <div class="text-lg font-extrabold text-[#16C653]">✓ Message Received (${state.contactSubmittedTicket})</div>
                <p class="text-xs text-[#64748B] dark:text-slate-300">Thank you for contacting APK Hub. Our team will respond shortly.</p>
                <button onclick="state.contactSubmittedTicket = null; renderApp();" class="px-4 py-2 rounded-xl bg-[#16C653] text-white text-xs font-bold cursor-pointer">Send Another</button>
              </div>
            ` : `
              <form onsubmit="event.preventDefault(); state.contactSubmittedTicket = 'APKHUB-' + Math.floor(100000 + Math.random() * 900000); renderApp();" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold mb-1">Name *</label>
                  <input required type="text" placeholder="Your Name" class="w-full px-4 py-3 rounded-xl bg-[#F5F8FF] dark:bg-[#0B1229] border border-slate-200 dark:border-white/10 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">Email *</label>
                  <input required type="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl bg-[#F5F8FF] dark:bg-[#0B1229] border border-slate-200 dark:border-white/10 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">Subject *</label>
                  <input required type="text" placeholder="Subject" class="w-full px-4 py-3 rounded-xl bg-[#F5F8FF] dark:bg-[#0B1229] border border-slate-200 dark:border-white/10 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">Message *</label>
                  <textarea required rows="4" placeholder="Your message..." class="w-full px-4 py-3 rounded-xl bg-[#F5F8FF] dark:bg-[#0B1229] border border-slate-200 dark:border-white/10 text-sm"></textarea>
                </div>
                <button type="submit" class="px-6 py-3 rounded-xl bg-[#16C653] text-white dark:text-[#0B1229] font-extrabold text-sm cursor-pointer">Submit Message</button>
              </form>
            `}
          </div>
        </div>
      `;
    }

    function renderFooter() {
      return `
        <footer class="bg-[#101A3A] text-slate-300 border-t border-white/10 mt-16">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
            <div>
              <span class="font-extrabold text-white text-sm">APK <span class="text-[#16C653]">Hub</span></span> · Download Unlimited APK · Fast &amp; Secure
            </div>
            <div class="flex flex-wrap gap-4">
              <button onclick="navigate('home')" class="hover:text-[#75E85C] cursor-pointer">Home</button>
              <button onclick="navigate('apps')" class="hover:text-[#75E85C] cursor-pointer">Apps</button>
              <button onclick="navigate('games')" class="hover:text-[#75E85C] cursor-pointer">Games</button>
              <button onclick="navigate('top-charts')" class="hover:text-[#75E85C] cursor-pointer">Top Charts</button>
              <button onclick="navigate('about')" class="hover:text-[#75E85C] cursor-pointer">About</button>
              <button onclick="navigate('contact')" class="hover:text-[#75E85C] cursor-pointer">Contact</button>
            </div>
          </div>
        </footer>
      `;
    }

    function renderApp() {
      const root = document.getElementById('apkhub-root');
      if (!root) return;
      let content = '';
      if (state.view === 'home') content = renderHomeView();
      else if (state.view === 'apps') content = renderDirectoryView('Android Applications Catalog', (a) => a.type === 'app');
      else if (state.view === 'games') content = renderDirectoryView('Android Games Catalog', (a) => a.type === 'game');
      else if (state.view === 'categories') content = renderDirectoryView(state.selectedCategory === 'All' ? 'All APK Categories' : state.selectedCategory + ' APKs', (a) => state.selectedCategory === 'All' || a.category === state.selectedCategory);
      else if (state.view === 'top-charts') content = renderDirectoryView('Top Charts & Most Downloaded APKs', () => true);
      else if (state.view === 'details') content = renderDetailsView();
      else if (state.view === 'download') content = renderDownloadView();
      else if (state.view === 'about') content = renderAboutView();
      else if (state.view === 'contact') content = renderContactView();
      else content = renderHomeView();

      root.innerHTML = renderHeader() + '<main class="flex-1">' + content + '</main>' + renderFooter();
    }

    // Automatically route subpaths on GitHub Pages (e.g., /gkpp/apps, /gkpp/games)
    (function initRouteFromPath() {
      const path = (window.location.pathname || '').toLowerCase();
      if (path.endsWith('/apps')) state.view = 'apps';
      else if (path.endsWith('/games')) state.view = 'games';
      else if (path.endsWith('/categories')) state.view = 'categories';
      else if (path.endsWith('/top-charts')) state.view = 'top-charts';
      else if (path.endsWith('/about')) state.view = 'about';
      else if (path.endsWith('/contact')) state.view = 'contact';
    })();

    renderApp();
  </script>
</body>
</html>
