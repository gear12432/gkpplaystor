    function sanitizeId(raw) {
      return String(raw || '').trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 120) || ('item-' + Date.now());

      try {
        for (const c of DEFAULT_CATEGORIES_SEED) {
          await setDoc(doc(db, 'categories', c.id), { ...c, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
        }
        for (const a of DEFAULT_APPS_SEED) {

        }
        for (const g of DEFAULT_GAMES_SEED) {

        }
        await setDoc(doc(db, 'websiteSettings', 'global'), { ...DEFAULT_SETTINGS_SEED, updatedAt: serverTimestamp() });
        showToast('Firebase Synced', 'All APK Hub collections populated in Firestore.');
      } catch (e) {
        showToast('Sync Notice', e.message || 'Could not seed database', 'error');
      }
    }

    let listenersAttached = false;
    function attachRealtimeListeners(uid) {
      if (listenersAttached) return;
      listenersAttached = true;
      let autoSeeded = false;

      onSnapshot(query(collection(db, 'apps'), where('status', 'in', ['active', 'inactive'])), (snap) => {
        state.apps = snap.docs.map(d => d.data());
        if (state.apps.length === 0 && !autoSeeded) {
          autoSeeded = true;
          seedDatabase(uid);
        }
        render();
      });

      onSnapshot(query(collection(db, 'games'), where('status', 'in', ['active', 'inactive'])), (snap) => {
        state.games = snap.docs.map(d => d.data());
        render();
      });

    onAuthStateChanged(auth, async (user) => {
      state.authChecking = true;
      render();
      if (!user) {
        state.user = null;
        state.isAuthorizedAdmin = false;
        state.authChecking = false;
        render();
        return;
      }

      const isBootstrapped = user.email && user.email.toLowerCase() === BOOTSTRAPPED_ADMIN_EMAIL.toLowerCase() && user.emailVerified;
      let hasAdminDoc = false;
      try {
        const snap = await getDoc(doc(db, 'admins', user.uid));
        hasAdminDoc = snap.exists();
      } catch {}

      if (!isBootstrapped && !hasAdminDoc) {
        state.authError = `Access Denied: "${user.email || user.uid}" is not an authorized administrator. Sign in with ${BOOTSTRAPPED_ADMIN_EMAIL}.`;
        await signOut(auth);
        state.user = null;
        state.isAuthorizedAdmin = false;
        state.authChecking = false;
        render();
        return;
      }

      if (isBootstrapped && !hasAdminDoc) {
        try {
          await setDoc(doc(db, 'admins', user.uid), {
            uid: user.uid,
            email: user.email,
            role: 'super_admin',
            createdAt: serverTimestamp()
          });
        } catch {}
      }

      state.user = user;
      state.isAuthorizedAdmin = true;
      state.authChecking = false;
      attachRealtimeListeners(user.uid);
      render();
    });

      try {

      } catch (err) {
        state.authError = 'Invalid email/password credentials or Email/Password provider is not yet enabled in Firebase Console. Use the Authorized Google Admin button below or enable Email/Password in Firebase Console.';

    window.saveAppOrGameForm = async (e) => {
      e.preventDefault();
      const f = e.target;
      const name = f.elements['name'].value.trim();
      const developer = f.elements['developer'].value.trim();
      const packageName = f.elements['packageName'].value.trim();
      const category = f.elements['category'].value.trim();
      const version = f.elements['version'].value.trim();
      const size = f.elements['size'].value.trim();
      const minAndroid = f.elements['minAndroid'].value.trim();
      const releaseDate = f.elements['releaseDate'].value.trim();
      const shortDescription = f.elements['shortDescription'].value.trim();
      const fullDescription = f.elements['fullDescription'].value.trim();
      const whatsNew = f.elements['whatsNew'].value.trim() || 'Verified release.';
      const iconUrl = f.elements['iconUrl'].value.trim();
      const apkFileName = f.elements['apkFileName'].value.trim() || `${packageName}-v${version}.apk`;
      const apkDownloadUrl = f.elements['apkDownloadUrl'].value.trim();
      const externalDownloadUrl = f.elements['externalDownloadUrl'].value.trim();
      const status = f.elements['status'].value;
      const featured = f.elements['featured'].checked;
      const trending = f.elements['trending'].checked;
      const downloadEnabled = f.elements['downloadEnabled'].checked;

      const id = state.editingId ? sanitizeId(state.editingId) : sanitizeId(name);
      const col = state.editingType === 'game' ? 'games' : 'apps';

      try {
        const refDoc = doc(db, col, id);
        const existingSnap = await getDoc(refDoc);
        const existing = existingSnap.exists() ? existingSnap.data() : null;
        await setDoc(refDoc, {
          id,
          slug: id,
          name: name.slice(0, 140),
          developer: developer.slice(0, 140),
          packageName: packageName.slice(0, 180),
          category: category.slice(0, 80),
          version: version.slice(0, 60),
          size: size.slice(0, 40),
          minAndroid: minAndroid.slice(0, 80),
          releaseDate: releaseDate.slice(0, 60),
          shortDescription: shortDescription.slice(0, 500),
          fullDescription: fullDescription.slice(0, 5000),
          whatsNew: whatsNew.slice(0, 2000),
          iconUrl: iconUrl.slice(0, 150000),
          screenshotUrls: existing?.screenshotUrls || [],
          apkFileName: apkFileName.slice(0, 240),
          apkDownloadUrl: apkDownloadUrl.slice(0, 2000),
          externalDownloadUrl: externalDownloadUrl.slice(0, 2000),
          status,
          downloadEnabled,
          featured,
          trending,
          downloads: existing?.downloads || 0,
          rating: existing?.rating || 4.8,
          createdBy: existing?.createdBy || state.user.uid,
          createdAt: existing?.createdAt || serverTimestamp(),
          updatedAt: serverTimestamp(),
        });
        showToast('Saved to Firebase', `${name} v${version} saved in /${col}.`);
        state.section = state.editingType === 'game' ? 'games' : 'apps';
        render();
      } catch (err) {
        showToast('Save Error', err.message, 'error');
      }
    };

              </div>
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <input name="iconUrl" value="${current?.iconUrl || ''}" placeholder="App Icon URL" class="px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" />
                <input name="apkFileName" value="${current?.apkFileName || ''}" placeholder="APK File Name (.apk)" class="px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs font-mono" />
                <input name="apkDownloadUrl" value="${current?.apkDownloadUrl || ''}" placeholder="Direct APK Download URL" class="px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" />
                <input name="externalDownloadUrl" value="${current?.externalDownloadUrl || ''}" placeholder="External Mirror URL" class="px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs" />
              </div>
              <div class="flex flex-wrap gap-6 pt-2">
                <label class="inline-flex items-center gap-2 text-xs font-bold"><input type="checkbox" name="featured" ${current?.featured ? 'checked' : ''} /> Featured</label>
                <label class="inline-flex items-center gap-2 text-xs font-bold"><input type="checkbox" name="trending" ${current?.trending ? 'checked' : ''} /> Trending</label>
                <label class="inline-flex items-center gap-2 text-xs font-bold"><input type="checkbox" name="downloadEnabled" ${current?.downloadEnabled !== false ? 'checked' : ''} /> Enable Download</label>
              </div>
              <button type="submit" class="px-6 py-3 rounded-xl bg-[#16C653] text-white font-extrabold text-sm shadow-lg cursor-pointer">
                ${current ? 'Update in Firebase' : 'Save to Firebase'}
              </button>
            </form>
          </div>
        `;
      } else if (state.section === 'categories') {
        mainHtml = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-3xl p-5 border border-slate-200/80 space-y-4 h-fit">
              <h2 class="text-base font-extrabold text-[#172033]">Add / Update Category</h2>
              <form onsubmit="saveCategoryForm(event)" class="space-y-3">
                <input name="catName" required placeholder="Category Name" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
                <input name="catIcon" placeholder="Icon Emoji (e.g. 💬) or URL" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
                <textarea name="catDesc" rows="2" placeholder="Description" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm"></textarea>
                <select name="catStatus" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm font-semibold">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-[#16C653] text-white font-extrabold text-xs sm:text-sm cursor-pointer">Save Category</button>
              </form>
            </div>
            <div class="lg:col-span-2 bg-white rounded-3xl p-5 border border-slate-200/80 space-y-3">
              <h2 class="text-base font-extrabold text-[#172033]">Categories (${state.categories.length})</h2>
              <div class="divide-y divide-slate-100">
                ${state.categories.map(c => `
                  <div class="py-3 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                      <span class="text-lg">${c.iconUrl || '📱'}</span>
                      <div>
                        <div class="text-sm font-extrabold text-[#172033]">${c.name}</div>
                        <div class="text-xs text-[#64748B]">${c.description}</div>
                      </div>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800">${c.status}</span>
                      <button onclick="deleteCategoryRecord('${c.id}')" class="px-2.5 py-1 rounded bg-red-50 text-red-600 text-xs font-bold">Delete</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (state.section === 'banners') {
        mainHtml = `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-3xl p-5 border border-slate-200/80 space-y-4">
              <h2 class="text-base font-extrabold text-[#172033]">Add Promotional Banner</h2>
              <form onsubmit="saveBannerForm(event)" class="space-y-3">
                <input name="bTitle" required placeholder="Banner Title" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
                <input name="bSub" placeholder="Subtitle" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
                <input name="bBtn" placeholder="Button Text (e.g. Download Now)" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
                <input name="bUrl" placeholder="Destination URL" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
                <select name="bPos" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm font-semibold">
                  <option value="hero">Hero Banner</option>
                  <option value="mid_promo">Mid Promo</option>
                  <option value="category_top">Category Spotlight</option>
                  <option value="footer_promo">Footer Promo</option>
                </select>
                <select name="bStatus" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm font-semibold">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
                <button type="submit" class="w-full py-3 rounded-xl bg-[#16C653] text-white font-extrabold text-sm cursor-pointer">Publish Banner</button>
              </form>
            </div>
            <div class="bg-white rounded-3xl p-5 border border-slate-200/80 space-y-3">
              <h2 class="text-base font-extrabold text-[#172033]">Published Banners (${state.banners.length})</h2>
              ${state.banners.map(b => `
                <div class="p-4 rounded-2xl bg-[#F4F7FC] flex items-center justify-between">
                  <div>
                    <div class="font-extrabold text-sm text-[#172033]">${b.title}</div>
                    <div class="text-xs text-[#64748B]">${b.subtitle} · ${b.position}</div>
                  </div>
                  <button onclick="deleteBannerRecord('${b.id}')" class="px-3 py-1.5 rounded-xl bg-red-50 text-red-600 text-xs font-bold">Delete</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (state.section === 'downloads' || state.section === 'analytics') {
        const allItems = [
          ...state.apps.map(r => ({ type: 'app', ...r })),
          ...state.games.map(r => ({ type: 'game', ...r }))
        ];
        mainHtml = `
          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 space-y-4">
            <h2 class="text-lg font-extrabold text-[#172033]">Download Management &amp; Analytics</h2>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse min-w-[650px]">
                <thead>
                  <tr class="border-b border-slate-200 text-[11px] font-extrabold uppercase text-[#64748B]">
                    <th class="py-3 px-3">App / Game</th>
                    <th class="py-3 px-3">Version</th>
                    <th class="py-3 px-3">APK File</th>
                    <th class="py-3 px-3">Total Downloads</th>
                    <th class="py-3 px-3">Status</th>
                    <th class="py-3 px-3 text-right">Toggle</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-xs sm:text-sm">
                  ${allItems.map(item => `
                    <tr>
                      <td class="py-3 px-3 font-extrabold">${item.name}</td>
                      <td class="py-3 px-3 font-mono">v${item.version}</td>
                      <td class="py-3 px-3 font-mono text-xs text-[#64748B]">${item.apkFileName}</td>
                      <td class="py-3 px-3 font-extrabold text-[#16C653]">${(item.downloads || 0).toLocaleString()}</td>
                      <td class="py-3 px-3">${item.downloadEnabled ? 'Enabled' : 'Disabled'}</td>
                      <td class="py-3 px-3 text-right">
                        <button onclick="toggleDownloadSwitch('${item.type}', '${item.id}', ${Boolean(item.downloadEnabled)}, '${item.apkFileName}', '${item.apkDownloadUrl}', '${item.externalDownloadUrl}')" class="px-3 py-1 rounded bg-amber-50 text-amber-800 text-xs font-bold">
                          ${item.downloadEnabled ? 'Disable' : 'Enable'}
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (state.section === 'settings') {
        const s = state.settings;
        mainHtml = `
          <form onsubmit="saveSettingsForm(event)" class="bg-white rounded-3xl p-5 sm:p-8 border border-slate-200/80 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <h2 class="text-lg font-extrabold text-[#172033]">Website Settings (/websiteSettings/global)</h2>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#16C653] text-white font-extrabold text-xs sm:text-sm cursor-pointer">Save Settings</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Website Name</label>
                <input name="websiteName" value="${s.websiteName || 'APK Hub'}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Contact Email</label>
                <input name="contactEmail" value="${s.contactEmail || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Website Description</label>
                <input name="websiteDescription" value="${s.websiteDescription || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-xs font-bold uppercase text-[#64748B] mb-1">Footer Text</label>
                <input name="footerText" value="${s.footerText || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-sm" />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <textarea name="privacyPolicy" rows="3" class="px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs">${s.privacyPolicy || ''}</textarea>
              <textarea name="termsConditions" rows="3" class="px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs">${s.termsConditions || ''}</textarea>
              <textarea name="disclaimer" rows="3" class="px-3.5 py-2.5 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs">${s.disclaimer || ''}</textarea>
            </div>
            <div class="flex gap-6 pt-2">
              <label class="inline-flex items-center gap-2 text-xs font-bold"><input type="checkbox" name="maintenanceMode" ${s.maintenanceMode ? 'checked' : ''} /> Maintenance Mode</label>
              <label class="inline-flex items-center gap-2 text-xs font-bold"><input type="checkbox" name="directDownloadsEnabled" ${s.directDownloadsEnabled !== false ? 'checked' : ''} /> Enable Direct Downloads</label>
            </div>
          </form>
        `;
      } else if (state.section === 'profile') {
        mainHtml = `
          <div class="bg-white rounded-3xl p-6 border border-slate-200/80 space-y-4 max-w-xl">
            <h2 class="text-lg font-extrabold text-[#172033]">Admin Profile</h2>
            <div class="p-4 rounded-2xl bg-[#F4F7FC] space-y-1">
              <div class="text-sm font-extrabold text-[#172033]">${state.user.displayName || 'APK Hub Super Admin'}</div>
              <div class="text-xs text-[#64748B]">${state.user.email}</div>
              <div class="text-xs text-[#16C653] font-bold">Status: Active · Role: Super Admin</div>
            </div>
            <button onclick="handleLogoutClick()" class="px-5 py-2.5 rounded-xl bg-red-600 text-white font-extrabold text-xs cursor-pointer">Logout Admin Session</button>
          </div>
        `;
      }

      root.innerHTML = `
        <div class="min-h-screen bg-[#F4F7FC] text-[#172033] flex flex-col lg:flex-row">
          ${state.toast ? `
            <div class="fixed top-4 right-4 z-50 bg-white border border-emerald-300 rounded-2xl p-4 shadow-xl max-w-sm">
              <div class="text-xs font-extrabold text-[#172033]">${state.toast.title}</div>
              <div class="text-xs text-[#64748B] mt-0.5">${state.toast.message}</div>
            </div>
          ` : ''}

          <aside class="w-full lg:w-72 bg-[#101A3A] text-white p-5 flex flex-col justify-between shrink-0">
            <div class="space-y-5">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-[#16C653] text-[#101A3A] font-black text-sm flex items-center justify-center">APK</div>
                  <div>
                    <div class="text-base font-extrabold">APK <span class="text-[#16C653]">Hub</span> <span class="text-[10px] px-1.5 py-0.5 rounded bg-[#7047EB]">Admin</span></div>
                    <div class="text-[11px] text-slate-400">Firebase Realtime Console</div>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <button onclick="openCreateItem('app')" class="py-2 px-3 rounded-xl bg-[#16C653] text-[#101A3A] font-extrabold text-xs cursor-pointer">+ Add App</button>
                <button onclick="openCreateItem('game')" class="py-2 px-3 rounded-xl bg-[#7047EB] text-white font-extrabold text-xs cursor-pointer">+ Add Game</button>
              </div>

              <nav class="flex lg:flex-col gap-1 overflow-x-auto pb-2 lg:pb-0">
                ${navItems.map(item => `
                  <button onclick="setSection('${item.id}')" class="px-3.5 py-2.5 rounded-xl text-xs font-bold text-left whitespace-nowrap cursor-pointer ${state.section === item.id ? 'bg-[#16C653] text-[#101A3A]' : 'text-slate-300 hover:bg-[#172554]'}">
                    ${item.label}
                  </button>
                `).join('')}
              </nav>
            </div>

            <div class="hidden lg:block pt-4 border-t border-white/10 space-y-2">
              <div class="text-xs text-slate-300 truncate">${state.user.email}</div>
              <button onclick="handleLogoutClick()" class="w-full py-2 rounded-xl bg-red-500/20 text-red-300 font-bold text-xs cursor-pointer">Logout</button>
            </div>
          </aside>

          <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-white border-b border-slate-200/80 px-4 sm:px-8 py-3.5 flex items-center justify-between">
              <div>
                <div class="text-sm sm:text-lg font-extrabold capitalize">${state.section.replace('-', ' ')}</div>
                <div class="text-[11px] text-[#64748B]">Connected to Firebase: <strong>bionic-bebop-t8gvj</strong></div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="handleSyncSeed()" class="px-3 py-2 rounded-xl bg-[#F4F7FC] border border-slate-200 text-xs font-bold cursor-pointer">Sync DB</button>
                <button onclick="openCreateItem('app')" class="px-3.5 py-2 rounded-xl bg-[#16C653] text-white font-extrabold text-xs cursor-pointer">+ New APK</button>
              </div>
            </header>

            <main class="p-4 sm:p-8 max-w-7xl w-full mx-auto flex-1">
              ${mainHtml}
            </main>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
